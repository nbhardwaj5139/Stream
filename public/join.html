<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta name="color-scheme" content="dark">
<title>Join the room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235b8cff%27/%3E%3Cpath d=%27M12.5 9.8v12.4L23 16z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movie Night">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="centered">
  <main class="card">
    <div class="card-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2.5"/>
        <path d="M7.5 11V7.5a4.5 4.5 0 0 1 9 0V11"/>
      </svg>
    </div>
    <h1>Movie night</h1>
    <p>Enter the passcode you were sent.</p>

    <form id="join-form" autocomplete="off">
      <label class="field">
        <span>Your name</span>
        <input id="name" type="text" maxlength="40" placeholder="So they know it's you" autocomplete="nickname">
      </label>

      <label class="field">
        <span>Passcode</span>
        <input id="passcode" type="text" inputmode="text" autocapitalize="characters"
               autocorrect="off" spellcheck="false" maxlength="64" required
               placeholder="ABC123" class="passcode-input">
      </label>

      <button id="submit" class="button primary wide" type="submit">Join</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <p class="card-foot">You only need to do this once on this device.</p>
  </main>

<script type="module">
const form = document.getElementById('join-form');
const passcode = document.getElementById('passcode');
const name = document.getElementById('name');
const error = document.getElementById('error');
const submit = document.getElementById('submit');

name.value = localStorage.getItem('stream:name') ?? '';
(name.value ? passcode : name).focus();

function fail(message) {
  error.textContent = message;
  error.hidden = false;
  passcode.select();
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  error.hidden = true;
  submit.disabled = true;
  submit.textContent = 'Checking…';

  try {
    const response = await fetch('/api/join', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ passcode: passcode.value.trim(), name: name.value.trim() }),
    });

    if (response.ok) {
      if (name.value.trim()) localStorage.setItem('stream:name', name.value.trim());
      location.replace('/');
      return;
    }

    const body = await response.json().catch(() => ({}));
    fail(body.error ?? 'Could not join. Try again.');
  } catch {
    fail('Could not reach the room. Is it still running?');
  } finally {
    submit.disabled = false;
    submit.textContent = 'Join';
  }
});
</script>
</body>
</html>
