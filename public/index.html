<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{THEME_COLOR}}">
<meta name="color-scheme" content="dark">
<title>{{ROOM_NAME}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235b8cff%27/%3E%3Cpath d=%27M12.5 9.8v12.4L23 16z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stream">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/static/styles.css?v={{ASSETS}}">
</head>
<body>

  <div class="gate" id="gate">
    <div class="cozy" aria-hidden="true">
      <div class="cozy-lights"></div>
      <div class="cozy-hearts"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <main class="card">
      <div class="card-icon" aria-hidden="true">
        <svg class="icon-classic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2.5"/>
          <path d="M7.5 11V7.5a4.5 4.5 0 0 1 9 0V11"/>
        </svg>
        <svg class="icon-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <h1 class="love">{{ROOM_NAME}}</h1>
      <p>Enter the passcode you were sent.</p>

      <form id="join-form" autocomplete="off">
        <label class="field">
          <span>Your name</span>
          <input id="name" type="text" maxlength="40" placeholder="So they know it's you" autocomplete="nickname">
        </label>

        <label class="field">
          <span>Passcode</span>
          <input id="passcode" type="text" inputmode="text" autocapitalize="characters"
                 autocorrect="off" spellcheck="false" maxlength="64" required
                 placeholder="ABC123" class="passcode-input">
          <span class="field-hint">Capitals don't matter.</span>
        </label>

        <button id="submit" class="button primary wide" type="submit">Join</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>

      <p class="card-foot">The passcode is asked for every time you open this.</p>
    </main>
  </div>

<div id="app" class="app" data-panel="closed" hidden>

  <main class="stage">
    <div class="screen">
      <video id="video" playsinline controls preload="auto"></video>

      <div id="placeholder" class="placeholder">
        <div class="cozy" aria-hidden="true">
      <div class="cozy-lights"></div>
      <div class="cozy-hearts"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
        <div class="placeholder-inner">
          <div class="placeholder-icon" aria-hidden="true">
            <svg class="icon-classic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2.5"/>
              <path d="M10 9.5v5l4-2.5z" fill="currentColor" stroke="none"/>
            </svg>
            <svg class="icon-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <h1 id="placeholder-title">Waiting to start</h1>
          <p id="placeholder-text">The screen will appear here by itself as soon as it is shared.</p>
          <p id="placeholder-hint" class="hint-line"></p>

          <form id="tonight" class="tonight" autocomplete="off" hidden>
            <div class="tonight-choice" role="radiogroup" aria-label="Look of the room">
              <label><input type="radio" name="theme" value="cozy"><span>Cozy 💕</span></label>
              <label><input type="radio" name="theme" value="classic"><span>Classic</span></label>
            </div>
            <label class="field">
              <span>💌 A surprise, revealed the moment they sign in</span>
              <textarea id="surprise-input" rows="3" maxlength="500"
                        placeholder="Write something only they will see…"></textarea>
            </label>
            <label class="field">
              <span>Heading on the passcode page <em>— anyone with the link sees this</em></span>
              <input id="heading-input" type="text" maxlength="80" placeholder="Tonight at the pictures">
            </label>
            <div class="tonight-actions">
              <span id="tonight-status" class="tonight-status" role="status"></span>
              <button id="tonight-save" class="button primary" type="submit">Save</button>
            </div>
          </form>
        </div>
      </div>

      <div id="overlay" class="overlay" hidden>
        <div class="spinner"></div>
        <span id="overlay-text">Waiting…</span>
      </div>

    </div>

    <div class="bar">
      <div class="bar-left">
        <span id="role-badge" class="role" hidden></span>
        <span id="now-showing" class="now-playing">Stream</span>
        <span id="sync-badge" class="badge">Connecting…</span>
      </div>

      <div class="bar-right">
        <button id="btn-sound" class="button sound" title="Sound on or off" hidden>
          <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
          </svg>
          <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4z"/>
            <path d="M22 9l-6 6M16 9l6 6"/>
          </svg>
          <span id="sound-label">Sound on</span>
        </button>

        <button id="btn-fullscreen" class="button" title="Fill the screen (F)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          <span>Fullscreen</span>
        </button>

        <button id="btn-share" class="button primary" title="Share this screen — pick Entire Screen and tick Share system audio" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></svg>
          <span>Share screen</span>
        </button>

        <button id="btn-reload" class="button" title="Reload if something gets stuck">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
          <span>Reload</span>
        </button>

        <button id="btn-exit" class="button" title="Sign out of the room" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Leave</span>
        </button>

        <button id="btn-panel" class="button" aria-expanded="false" title="Chat and who is watching">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="panel-label">Chat</span>
        </button>
      </div>
    </div>

  </main>

  <aside class="panel" id="panel">
    <header class="panel-head">
      <div>
        <div class="panel-title">Watching now</div>
        <div class="who" id="presence"></div>
      </div>
      <div class="panel-actions">
        <button id="btn-test" class="button ghost" title="Check that screen sharing will connect">Test link</button>
        <button id="btn-leave" class="button ghost" title="Sign out of the room">Leave</button>
        <button id="btn-panel-close" class="icon-button" aria-label="Close panel">×</button>
      </div>
    </header>
    <div class="link-stats" id="link-stats" hidden>
      <span class="link-dot" id="link-dot"></span>
      <span id="link-text">Measuring…</span>
    </div>

    <div class="chat" id="chat"></div>
    <div class="emoji-row" id="emoji-row" role="group" aria-label="Add an emoji">
      <button type="button" data-emoji="😂" aria-label="Laughing">😂</button>
      <button type="button" data-emoji="😮" aria-label="Surprised">😮</button>
      <button type="button" data-emoji="😢" aria-label="Sad">😢</button>
      <button type="button" data-emoji="❤️" aria-label="Heart">❤️</button>
      <button type="button" data-emoji="👏" aria-label="Clapping">👏</button>
      <button type="button" data-emoji="🔥" aria-label="Fire">🔥</button>
      <button type="button" data-emoji="🍿" aria-label="Popcorn">🍿</button>
      <button type="button" data-emoji="😴" aria-label="Sleepy">😴</button>
    </div>
    <form class="composer" id="composer">
      <input id="chat-input" type="text" placeholder="Say something…" autocomplete="off" maxlength="800">
      <button class="button primary" type="submit">Send</button>
    </form>
  </aside>

  <div class="reveal" id="reveal" hidden>
    <div class="reveal-hearts" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="reveal-card" role="dialog" aria-modal="true" aria-labelledby="reveal-text">
      <button class="icon-button reveal-x" id="reveal-x" type="button" aria-label="Close">×</button>
      <p class="reveal-kicker">A message for you</p>
      <p class="reveal-text love" id="reveal-text"></p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script type="module" src="/static/app.js?v={{ASSETS}}"></script>
</body>
</html>
